Listen 127.0.0.1:41444

<VirtualHost 127.0.0.1:41444>
    ServerName localhost
    DocumentRoot /usr/share/revpi-webserver/www

    <Directory /usr/share/revpi-webserver/www>
        Require all denied
    </Directory>

    Include /usr/share/revpi-webserver/apache2/conf

    # Keep Cockpit's redirect on the browser's HTTPS origin.
    UseCanonicalPhysicalPort On
    RedirectRelative On

    ErrorLog ${APACHE_LOG_DIR}/revpi-nexigon-error.log
    CustomLog ${APACHE_LOG_DIR}/revpi-nexigon-access.log combined
</VirtualHost>
