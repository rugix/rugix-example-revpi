name: CI

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  RUGIX_VERSION: v1.3.0

jobs:
  release-metadata:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.metadata.outputs.build_tag }}
      floating_tag: ${{ steps.metadata.outputs.floating_tag }}
      git_release_tag: ${{ steps.metadata.outputs.git_release_tag }}
    steps:
      - name: Generate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          timestamp=$(date -u +"%Y%m%d%H%M%S")
          short_commit="${GITHUB_SHA::8}"
          build_tag="build-${timestamp}-${short_commit}-${GITHUB_RUN_ID}"
          floating_tag=""
          git_release_tag=""

          if [ "${GITHUB_REF_TYPE}" = "branch" ]; then
              branch=${GITHUB_REF_NAME//\//-}
              branch=${branch//[^A-Za-z0-9._-]/-}
              floating_tag="latest-build-${branch}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              git_release_tag="${GITHUB_REF_NAME}"
          fi

          {
              echo "build_tag=${build_tag}"
              echo "floating_tag=${floating_tag}"
              echo "git_release_tag=${git_release_tag}"
          } >>"${GITHUB_OUTPUT}"

  app-bundle:
    name: Build App Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Install Rugix Bundler
        shell: bash
        run: |
          set -euo pipefail

          case "$(uname -m)" in
              x86_64|amd64) triple="x86_64-unknown-linux-musl" ;;
              aarch64|arm64) triple="aarch64-unknown-linux-musl" ;;
              *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          mkdir -p .tools
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "${tmpdir}"' EXIT

          curl -fsSL \
              "https://github.com/rugix/rugix/releases/download/${RUGIX_VERSION}/binaries-${triple}.tar" \
              -o "${tmpdir}/rugix-binaries.tar"
          tar -xf "${tmpdir}/rugix-binaries.tar" -C "${tmpdir}"

          bundler="$(find "${tmpdir}" -type f -name rugix-bundler -perm -111 | head -n 1)"
          if [ -z "${bundler}" ]; then
              echo "rugix-bundler not found in release archive" >&2
              exit 1
          fi
          install -m 0755 "${bundler}" .tools/rugix-bundler

      - name: Build app bundle
        env:
          CONTAINER_RUNTIME: docker
          RUGIX_BUNDLER: ${{ github.workspace }}/.tools/rugix-bundler
        run: apps/revpi-dio-grafana/build.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: revpi-dio-grafana-app
          path: |
            apps/revpi-dio-grafana/build/revpi-dio-grafana.rugixb
            apps/revpi-dio-grafana/build/revpi-dio-grafana.rugixb-hash
          if-no-files-found: error
          compression-level: 0

  debos:
    name: Build Debos Image (${{ matrix.variant }})
    runs-on: [self-hosted, nixos]
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: rugix-apps
            output: revpi-rugix-apps
            nexigon: "false"
          - variant: rugix-apps-nexigon
            output: revpi-rugix-apps-nexigon
            nexigon: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build debos image and bundle
        working-directory: os/debos
        env:
          NEXIGON: ${{ matrix.nexigon }}
          OUTPUT: ${{ matrix.output }}
          VERSION: ${{ needs.release-metadata.outputs.build_tag }}
        run: |
          set -euo pipefail

          args=(
              -tflavour:lite
              -ttype:rugix
              -tdocker:true
              -trugix_apps:true
              -trugix_admin:true
              -tgen_sbom:true
              -toutput:"${OUTPUT}"
              -tversion:"${VERSION}"
          )
          if [ "${NEXIGON}" = "true" ]; then
              args+=(
                  -tnexigon:true
                  -tnexigon_provisioning:true
              )
          fi

          ./run-debos "${args[@]}" revpi.yaml

      - name: Collect debos artifacts
        working-directory: os/debos
        env:
          OUTPUT: ${{ matrix.output }}
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist
          for src in build/"${OUTPUT}".* build/packages_"${OUTPUT}".csv; do
              if [ -e "${src}" ]; then
                  cp "${src}" dist/
              fi
          done
          sbom=build/sbom-"${OUTPUT}".json
          if [ ! -e "${sbom}" ]; then
              echo "expected SPDX SBOM '${sbom}' was not generated" >&2
              exit 1
          fi
          cp "${sbom}" dist/"${OUTPUT}".spdx.json

          if ! find dist -type f -print -quit | grep -q .; then
              echo "no debos artifacts found" >&2
              exit 1
          fi

      - name: Upload debos artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output }}
          path: os/debos/dist/
          if-no-files-found: error
          compression-level: 0

  publish-nexigon:
    name: Publish Nexigon Release
    runs-on: ubuntu-latest
    concurrency:
      group: nexigon-publication
      cancel-in-progress: false
    needs:
      - release-metadata
      - app-bundle
      - debos
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Install Nexigon CLI
        run: curl -fsSL https://install.nexigon.dev/download-cli.sh | sh

      - name: Publish Nexigon assets and tags
        env:
          ARTIFACT_DIR: dist
          BUILD_TAG: ${{ needs.release-metadata.outputs.build_tag }}
          FLOATING_TAG: ${{ needs.release-metadata.outputs.floating_tag }}
          GIT_RELEASE_TAG: ${{ needs.release-metadata.outputs.git_release_tag }}
          NEXIGON_CLI: ./nexigon-cli
          NEXIGON_HUB_URL: ${{ secrets.NEXIGON_HUB_URL }}
          NEXIGON_REPOSITORY: ${{ secrets.NEXIGON_REPOSITORY }}
          NEXIGON_TOKEN: ${{ secrets.NEXIGON_TOKEN }}
        run: |
          set -euo pipefail

          publish_rolling="false"
          publish_stable="false"
          floating_tag="${FLOATING_TAG}"
          if [ "${GITHUB_REF_TYPE}" = "branch" ]; then
              remote_ref="refs/remotes/origin/${GITHUB_REF_NAME}"
              if ! remote_commit=$(git rev-parse --verify "${remote_ref}" 2>/dev/null) \
                  || [ "${remote_commit}" != "${GITHUB_SHA}" ]; then
                  echo "[INFO] a newer '${GITHUB_REF_NAME}' build exists; not moving channel tags"
                  floating_tag=""
              elif [ "${GITHUB_REF_NAME}" = "main" ]; then
                  publish_rolling="true"
              fi
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              latest_tag=$(git tag --list --sort=-version:refname | sed -n '1p')
              if [ "${latest_tag}" = "${GITHUB_REF_NAME}" ]; then
                  publish_stable="true"
              fi
          fi

          config="${RUNNER_TEMP}/nexigon-cli.toml"
          umask 077
          printf 'hub-url = "%s"\ntoken = "%s"\n' \
              "${NEXIGON_HUB_URL}" "${NEXIGON_TOKEN}" >"${config}"
          export NEXIGON_CLI_CONFIG="${config}"
          export FLOATING_TAG="${floating_tag}"
          export PUBLISH_ROLLING="${publish_rolling}"
          export PUBLISH_STABLE="${publish_stable}"

          ./scripts/publish-nexigon-release.sh

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - app-bundle
      - debos
    if: github.ref_type == 'tag'
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
              echo "[ERROR] no release assets found"
              exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" "${files[@]}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --clobber
          else
              gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --title "${GITHUB_REF_NAME}" \
                  --notes "Rugix RevPi build for ${GITHUB_SHA}."
          fi
