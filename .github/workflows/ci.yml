name: CI

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  RUGIX_VERSION: v1.4.0

jobs:
  release-metadata:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.metadata.outputs.build_tag }}
      floating_tag: ${{ steps.metadata.outputs.floating_tag }}
      git_release_tag: ${{ steps.metadata.outputs.git_release_tag }}
    steps:
      - name: Generate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          timestamp=$(date -u +"%Y%m%d%H%M%S")
          short_commit="${GITHUB_SHA::8}"
          build_tag="build-${timestamp}-${short_commit}"
          floating_tag=""
          git_release_tag=""

          if [ "${GITHUB_REF_TYPE}" = "branch" ]; then
              branch=${GITHUB_REF_NAME//\//-}
              branch=${branch//[^A-Za-z0-9._-]/-}
              floating_tag="latest-build-${branch}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              git_release_tag="${GITHUB_REF_NAME}"
          fi

          {
              echo "build_tag=${build_tag}"
              echo "floating_tag=${floating_tag}"
              echo "git_release_tag=${git_release_tag}"
          } >>"${GITHUB_OUTPUT}"

  app-bundle:
    name: Build App Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Project Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build app bundle
        env:
          CONTAINER_RUNTIME: docker
        run: mise run build

      - name: Upload app bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: revpi-dio-grafana-app
          path: |
            apps/revpi-dio-grafana/build/revpi-dio-grafana.rugixb
            apps/revpi-dio-grafana/build/revpi-dio-grafana.rugixb-hash
          if-no-files-found: error
          compression-level: 0

  debos:
    name: Build RevPi Image (${{ matrix.output }})
    runs-on: [self-hosted, si-large]
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - output: revpi-rugix
            nexigon: "false"
          - output: revpi-rugix-nexigon
            nexigon: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare mise platform detection
        run: |
          ldd_path=$(nix develop --command bash -c 'command -v ldd')
          dirname "$ldd_path" >> "$GITHUB_PATH"

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Project Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Build debos image and bundle
        env:
          NEXIGON: ${{ matrix.nexigon }}
          OUTPUT: ${{ matrix.output }}
          VERSION: ${{ needs.release-metadata.outputs.build_tag }}
        run: mise run build:os:release

      - name: Collect debos artifacts
        env:
          OUTPUT: ${{ matrix.output }}
        run: mise run release:collect

      - name: Upload debos artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.output }}
          path: os/debos/dist/
          if-no-files-found: error
          compression-level: 0

  publish-nexigon:
    name: Publish Nexigon Release
    runs-on: ubuntu-latest
    concurrency:
      group: nexigon-publication
      cancel-in-progress: false
    needs:
      - release-metadata
      - app-bundle
      - debos
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Project Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist

      - name: Publish Nexigon assets and tags
        env:
          ARTIFACT_DIR: dist
          BUILD_TAG: ${{ needs.release-metadata.outputs.build_tag }}
          FLOATING_TAG: ${{ needs.release-metadata.outputs.floating_tag }}
          GIT_RELEASE_TAG: ${{ needs.release-metadata.outputs.git_release_tag }}
          NEXIGON_HUB_URL: ${{ secrets.NEXIGON_HUB_URL }}
          NEXIGON_REPOSITORY: ${{ secrets.NEXIGON_REPOSITORY }}
          NEXIGON_TOKEN: ${{ secrets.NEXIGON_TOKEN }}
        run: |
          set -euo pipefail

          publish_rolling="false"
          publish_stable="false"
          floating_tag="${FLOATING_TAG}"
          if [ "${GITHUB_REF_TYPE}" = "branch" ]; then
              remote_ref="refs/remotes/origin/${GITHUB_REF_NAME}"
              if ! remote_commit=$(git rev-parse --verify "${remote_ref}" 2>/dev/null) \
                  || [ "${remote_commit}" != "${GITHUB_SHA}" ]; then
                  echo "[INFO] a newer '${GITHUB_REF_NAME}' build exists; not moving channel tags"
                  floating_tag=""
              elif [ "${GITHUB_REF_NAME}" = "main" ]; then
                  publish_rolling="true"
              fi
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              latest_tag=$(git tag --list --sort=-version:refname | sed -n '1p')
              if [ "${latest_tag}" = "${GITHUB_REF_NAME}" ]; then
                  publish_stable="true"
              fi
          fi

          config="${RUNNER_TEMP}/nexigon-cli.toml"
          umask 077
          printf 'hub-url = "%s"\ntoken = "%s"\n' \
              "${NEXIGON_HUB_URL}" "${NEXIGON_TOKEN}" >"${config}"
          export NEXIGON_CLI_CONFIG="${config}"
          export FLOATING_TAG="${floating_tag}"
          export PUBLISH_ROLLING="${publish_rolling}"
          export PUBLISH_STABLE="${publish_stable}"

          mise run publish

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - app-bundle
      - debos
    if: github.ref_type == 'tag'
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
              echo "[ERROR] no release assets found"
              exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" "${files[@]}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --clobber
          else
              gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --title "${GITHUB_REF_NAME}" \
                  --notes "Rugix RevPi build for ${GITHUB_SHA}."
          fi
